# Cau hinh mac dinh cho cac thanh phan huong dich vu. Ghi de bang bien moi truong (vd APP_NOTIFY_URL).
# Dat o tep rieng de khong dong vao application.properties.

# Dich vu thong bao (toyland-notify). De trong: outbox gui email truc tiep bang SMTP cua chinh he thong,
# con webhook cho doi tac bi bo qua (can co toyland-notify moi gui duoc webhook).
app.notify.url=
# Chuoi bi mat dung chung giua toyland-api va toyland-notify de ky HMAC yeu cau noi bo.
app.notify.token=

# Bo phat su kien (transactional outbox)
app.outbox.relay-delay-ms=4000
app.outbox.batch=50
app.outbox.max-attempts=8

# Phi van chuyen co dinh cho don do doi tac dat qua API
app.partner.shipping-fee=30000

# Giam sat: chi mo health (UP/DOWN), khong kiem tra may chu mail vi SMTP co the chan tren host mien phi
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

# Moi dong log mang ma truy vet cua yeu cau (RequestIdFilter)
logging.pattern.level=%5p [%X{requestId:-}]

# Resilience4j cho cuoc goi sang GHN (chi cac ham doc, an toan de thu lai)
resilience4j.retry.instances.ghn.max-attempts=3
resilience4j.retry.instances.ghn.wait-duration=300ms
resilience4j.retry.instances.ghn.enable-exponential-backoff=true
resilience4j.retry.instances.ghn.exponential-backoff-multiplier=2
resilience4j.retry.instances.ghn.retry-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException
resilience4j.circuitbreaker.instances.ghn.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.ghn.sliding-window-size=10
resilience4j.circuitbreaker.instances.ghn.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.ghn.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ghn.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.ghn.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.ghn.record-exceptions=org.springframework.web.client.ResourceAccessException,org.springframework.web.client.HttpServerErrorException

# Resilience4j cho truy van trang thai MoMo (chi doc, an toan de thu lai)
resilience4j.retry.instances.momo-query.max-attempts=2
resilience4j.retry.instances.momo-query.wait-duration=500ms
resilience4j.retry.instances.momo-query.retry-exceptions=com.toyland.common.exception.ApiException
resilience4j.circuitbreaker.instances.momo-query.sliding-window-size=10
resilience4j.circuitbreaker.instances.momo-query.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.momo-query.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.momo-query.wait-duration-in-open-state=60s
resilience4j.circuitbreaker.instances.momo-query.record-exceptions=com.toyland.common.exception.ApiException
