spring.application.name=toyland-api
server.port=8080

# ===================== CSDL (chay database/toyland_v2.sql truoc) =====================
spring.datasource.url=jdbc:mysql://localhost:3306/toyland_v2?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=root
# XAMPP de trong; MySQL Workbench nhap mat khau root cua ban
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
# Nap lazy theo lo (giam N+1 query khi hien danh sach san pham)
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jackson.serialization.write-dates-as-timestamps=false

# ===================== JWT =====================
app.jwt.secret=kGZXlDXcnDUxO+b9Xwu0FitIFcIY3SFy23p8ZP856EaJiVonnpc1EW460pxgY0AHFU8yoI/0z10eMaDVwiuyRg==
# Access token 15 phut, refresh token 7 ngay
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-days=7
# Link xac nhan email khi dang ky / doi email co hieu luc bao nhieu gio
app.auth.email-verify-hours=24

# ===================== Dia chi =====================
app.frontend-url=http://localhost:4200
app.public-base-url=http://localhost:8080
app.cors.allowed-origins=http://localhost:4200

# ===================== Upload anh =====================
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB

# ===================== Ban hang =====================
# Mien phi van chuyen cho don tu 500.000d (0 = tat)
app.shipping.free-threshold=500000
# Phi ship co dinh khi CHUA cau hinh GHN hoac GHN loi
app.shipping.fixed-fee=30000
app.order.gift-wrap-fee=20000
# So phut cho thanh toan VNPay truoc khi tu huy
app.order.payment-timeout-minutes=15
# So ngay sau khi giao duoc yeu cau tra hang; het han thi don tu chuyen HOAN TAT
app.order.return-days=7

# ===================== Khach hang than thiet (diem thuong) =====================
# Moi 10.000d tien hang (sau giam gia, khong tinh phi ship) = 1 diem x he so hang (Bac 1.1, Vang 1.25, Kim cuong 1.5)
app.loyalty.earn-per-amount=10000
# 1 diem = 100d khi thanh toan; dung toi da 50% gia tri hang sau voucher
app.loyalty.point-value=100
app.loyalty.max-redeem-percent=50

