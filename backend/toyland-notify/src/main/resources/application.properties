# toyland-notify: dich vu thong bao doc lap cua ToyLand.
# Moi gia tri co the ghi de bang bien moi truong (SPRING_DATASOURCE_URL, NOTIFY_TOKEN, SPRING_MAIL_HOST...).
spring.application.name=toyland-notify
server.port=${PORT:8081}

# CSDL rieng (schema toyland_notify), khong dung chung bang voi toyland-api
spring.datasource.url=jdbc:mysql://localhost:3306/toyland_notify?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=4
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Chuoi bi mat dung chung voi toyland-api (app.notify.token) de ky HMAC yeu cau noi bo
notify.token=
# Gui thu: tat thi chi ghi log
notify.mail.enabled=false
notify.mail.from=ToyLand <no-reply@toyland.vn>

# Gui lai: so lan toi da, thoi gian cho co ban (giay), tran thoi gian cho (giay)
notify.retry.max-attempts=6
notify.retry.base-seconds=10
notify.retry.max-seconds=600
notify.worker.delay-ms=3000

spring.mail.host=smtp-relay.brevo.com
spring.mail.port=2525
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
