          description: OK
  /api/v1/orders:
    get:
      tags:
      - 08. Đặt hàng & Đơn hàng của tôi
      operationId: myOrders
      parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - PENDING_PAYMENT
          - PENDING
          - CONFIRMED
          - PACKING
          - SHIPPING
          - DELIVERED
          - DELIVERY_FAILED
          - COMPLETED
          - CANCELLED
          - RETURN_REQUESTED
          - RETURNED
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 10
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PageResponseOrderSummary'
    post:
      tags:
      - 08. Đặt hàng & Đơn hàng của tôi
      summary: 'Đặt hàng từ giỏ. Nếu MoMo: trả về paymentUrl để chuyển hướng'
      description: 'Nên gửi header Idempotency-Key (chuỗi ngẫu nhiên duy nhất cho mỗi lần bấm Đặt hàng). Gửi lại cùng khóa
        + cùng nội dung sẽ nhận lại đơn đã tạo, không tạo đơn thứ hai. Cùng khóa nhưng nội dung khác: 409 IDEMPOTENCY_KEY_REUSED.
        Đang xử lý: 409 IDEMPOTENCY_IN_PROGRESS.'
      operationId: place
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
        required: true
      responses:
        '201':
          description: Created
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PlaceOrderResponse'
