openapi: 3.1.0
info:
  title: ToyLand Web API
  version: 1.0.0
  description: API cho ứng dụng Angular và ứng dụng di động. Xác thực JWT Bearer. Đặt hàng nên gửi `Idempotency-Key`.
servers:
- url: https://sptoy-api.onrender.com
- url: http://localhost:8080
security:
- bearerAuth: []
paths:
